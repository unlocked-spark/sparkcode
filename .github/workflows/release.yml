# SparkCode release: a pushed tag v<upstream>-sparkcode.<n> (or a manual run
# with that version) builds the Windows CLI and publishes a GitHub Release with
# sparkcode-windows-x64.zip, SHA256SUMS, install.ps1 and the two version feeds.
# The product site redirects to these assets; nothing is deployed from here.
name: release

on:
  push:
    tags:
      - "v*-sparkcode.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 2.0.32-sparkcode.1. The tag v<version> is created at this commit when it does not exist."
        required: true
        type: string

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then version="$INPUT_VERSION"; else version="$GITHUB_REF_NAME"; fi
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-sparkcode\.[0-9]+$'; then
            echo "::error::$version is not a release version; expected <upstream>-sparkcode.<n>"
            exit 1
          fi
          # The first check and the cheapest: the tag must carry the upstream version
          # the code reports in its User-Agent (packages/util/src/sparkcode.ts).
          upstream=$(sed -n 's/^export const SPARKCODE_UPSTREAM_VERSION = "\([^"]*\)".*/\1/p' packages/util/src/sparkcode.ts)
          case "$version" in
            "$upstream-sparkcode."*) ;;
            *) echo "::error::tag version $version does not start with SPARKCODE_UPSTREAM_VERSION $upstream; bump the constant or fix the tag"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Check the version with the release script
        run: bun script/sparkcode-release.ts check --version "${{ steps.version.outputs.version }}"

      - name: Build the Windows CLI
        run: bun packages/cli/script/build.ts --target=opencode-windows-x64 --skip-web-ui
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: sparkcode

      - name: Package the release assets
        run: |
          bun script/sparkcode-release.ts package \
            --version "${{ steps.version.outputs.version }}" \
            --exe packages/cli/dist/cli-windows-x64/bin/opencode.exe \
            --installer installer/install.ps1 \
            --out release
          ls -l release
          cat release/SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # Created as a draft, so releases/latest/download never points at a
          # release whose assets are still uploading; published at the end.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --draft \
              --notes "SparkCode $VERSION, based on opencode $UPSTREAM.

          Install on Windows from PowerShell:

              irm https://sparkcode.unlockedspark.org/install.ps1 | iex

          Update an installed copy with: sparkcode update"
          fi
          # A re-run replaces the assets of the existing release.
          gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
